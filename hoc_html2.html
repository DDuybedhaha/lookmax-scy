<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore PSL Arena | Solo Elo 400</title>
    <!-- Nhúng thư viện MediaPipe Face Mesh từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1c29 0%, #0a0b10 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ff4757;
            margin-bottom: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
            text-align: center;
        }

        .header-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #12131a;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Lật gương cho tự nhiên */
            aspect-ratio: 4/3;
            object-fit: cover;
        }

        canvas#output_canvas {
            display: none;
        }

        /* Bảng thông số Elo & PSL bên dưới video */
        .hud-panel {
            width: 100%;
            max-width: 500px;
            margin-top: 12px;
            background: rgba(13, 15, 23, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .score-box {
            grid-column: span 2;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.15), rgba(255, 165, 2, 0.15));
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 10px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(255, 71, 87, 0.1);
        }

        .score-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff4757;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .score-rank {
            font-size: 11px;
            color: #ffa502;
            font-weight: 600;
            margin-top: 2px;
        }

        .hud-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-item span:first-child {
            color: #94a3b8;
            font-size: 11px;
        }

        .hud-item span:last-child {
            font-weight: 600;
            color: #f1f5f9;
            font-size: 11px;
        }

        /* Nút bấm solo */
        .action-panel {
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
        }

        .btn-scan {
            width: 100%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-scan:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Toast thông báo */
        #toast {
            position: fixed;
            top: 15px;
            background: rgba(18, 19, 26, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            font-weight: 600;
            font-size: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    
    <div id="toast">Đang khởi tạo hệ thống...</div>

    <div>
        <div class="header-title">⚔️ Hardcore Solo Arena</div>
        <div class="header-subtitle">Hệ thống đấu trường Elo 400 - Camera chạy liên tục</div>
    </div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="hud-panel">
        <div class="score-box">
            <div class="score-title">Mức Elo Solo Hiện Tại</div>
            <div class="score-value" id="hud-elo">400 ELO</div>
            <div class="score-rank" id="hud-rank">Sẵn sàng so tài, hãy bấm chấm điểm...</div>
        </div>
        <div class="hud-item"><span>PSL Score</span> <span id="hud-score">--</span></div>
        <div class="hud-item"><span>Canthal Tilt</span> <span id="hud-canthal">--</span></div>
        <div class="hud-item"><span>Jawline Ratio</span> <span id="hud-jaw">--</span></div>
        <div class="hud-item"><span>Midface</span> <span id="hud-midface">--</span></div>
    </div>

    <div class="action-panel">
        <button id="btn-capture" class="btn-scan" onclick="evaluateAndFight()">🔥 Chấm điểm & So tài Elo</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        let latestLandmarks = null;
        
        // Khởi đầu Elo bằng 400
        let currentElo = 400;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function calculateDistance3D(p1, p2) {
            return Math.sqrt(
                Math.pow(p1.x - p2.x, 2) +
                Math.pow(p1.y - p2.y, 2) +
                Math.pow((p1.z || 0) - (p2.z || 0), 2)
            );
        }

        function getHardcorePSLRank(score) {
            if (score >= 6.5) return "Apex Elite / Chadlite 🏆";
            if (score >= 5.5) return "High Tier Normie 🔥";
            if (score >= 4.5) return "Mid Normie ⚖️";
            if (score >= 3.5) return "Sub-Normie 📉";
            return "Raw Sub5 ⚠️";
        }

        // Bấm chấm điểm liên tục, không freeze camera
        function evaluateAndFight() {
            if (!latestLandmarks) {
                showToast("⚠️ Chưa nhận diện được khuôn mặt! Hãy canh lại camera.");
                return;
            }

            processHardcorePSL(latestLandmarks);
            showToast("⚔️ Đã cập nhật điểm số và Elo solo!");
        }

        function processHardcorePSL(lm) {
            if (!lm) return;

            // 1. Kiểm tra tư thế
            const leftEye = lm[33];
            const rightEye = lm[362];
            const eyeLevelDiff = Math.abs(leftEye.y - rightEye.y);
            let posturePenalty = eyeLevelDiff > 0.03 ? 0.5 : 1.0;

            // 2. Canthal Tilt
            const leftOuterY = lm[133].y;
            const leftInnerY = lm[33].y;
            const leftTiltDiff = leftInnerY - leftOuterY; 
            
            let canthalScore = 0.2; 
            if (leftTiltDiff > 0.010) canthalScore = 1.0; 
            else if (leftTiltDiff > 0.005) canthalScore = 0.6; 
            else if (leftTiltDiff > 0.002) canthalScore = 0.4;
            else canthalScore = 0.2; 

            // 3. Jawline Ratio
            const bizygomaticWidth = calculateDistance3D(lm[234], lm[454]);
            const jawWidth = calculateDistance3D(lm[172], lm[397]);
            const jawToBizygomatic = jawWidth / (bizygomaticWidth > 0 ? bizygomaticWidth : 1);
            
            let jawScore = 0.2;
            if (jawToBizygomatic >= 0.83 && jawToBizygomatic <= 0.88) {
                jawScore = 1.0;
            } else if (jawToBizygomatic >= 0.79 && jawToBizygomatic <= 0.91) {
                jawScore = 0.6;
            } else if (jawToBizygomatic >= 0.75 && jawToBizygomatic <= 0.95) {
                jawScore = 0.4;
            } else {
                jawScore = 0.2; 
            }

            // 4. Midface
            const browCenter = lm[9];
            const mouthCenter = lm[13];
            const faceWidth = bizygomaticWidth;
            const midfaceLength = calculateDistance3D(browCenter, mouthCenter);
            const midfaceRatio = midfaceLength / (faceWidth > 0 ? faceWidth : 1);
            
            let midfaceScore = 0.2;
            if (midfaceRatio < 1.06) midfaceScore = 1.0;
            else if (midfaceRatio < 1.10) midfaceScore = 0.6;
            else if (midfaceRatio < 1.15) midfaceScore = 0.4;
            else midfaceScore = 0.2;

            // Tính điểm PSL
            const compositeScore = (jawScore * 0.45 + canthalScore * 0.35 + midfaceScore * 0.20) * posturePenalty;
            let rawScore = 2.8 + compositeScore * 4.0;
            rawScore = Math.min(6.8, Math.max(3.0, rawScore));
            const finalScore = rawScore.toFixed(1);
            const rankName = getHardcorePSLRank(parseFloat(finalScore));

            // Hệ thống Elo solo dựa trên PSL (Mốc chuẩn cơ bản là 5.0 PSL ứng với Elo 400)
            let pslValue = parseFloat(finalScore);
            let eloChange = Math.round((pslValue - 5.0) * 35);
            currentElo = Math.max(100, 400 + eloChange);

            // Hiển thị thông số lên HUD
            document.getElementById('hud-elo').innerText = currentElo + " ELO " + (eloChange >= 0 ? `(+${eloChange})` : `(${eloChange})`);
            document.getElementById('hud-score').innerText = String(finalScore).replace('.', ',') + " / 10 (" + rankName + ")";
            document.getElementById('hud-canthal').innerText = leftTiltDiff > 0.010 ? "Positive ⚡" : "Flat / Neutral";
            document.getElementById('hud-jaw').innerText = jawToBizygomatic.toFixed(2) + (jawScore === 1.0 ? " (Ideal)" : " (Avg)");
            document.getElementById('hud-midface').innerText = midfaceRatio < 1.08 ? "Compact 🔥" : "Extended";
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                // Luôn cập nhật liên tục tọa độ gương mặt do camera chạy trực tiếp
                latestLandmarks = results.multiFaceLandmarks[0];
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                showToast("⚔️ Đấu trường Solo Elo 400 đã sẵn sàng!");
            })
            .catch((err) => {
                showToast("Lỗi mở Camera!");
                console.error(err);
            });
    </script>
</body>
</html>
