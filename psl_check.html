<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore PSL Analyzer | Cyberpunk Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #131520 0%, #07080d 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ff4757;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            text-align: center;
        }

        .header-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
            background: #12131a;
        }

        video, canvas#snapshot-canvas {
            display: block;
            width: 100%;
            height: auto;
            transform: scaleX(-1);
            aspect-ratio: 4/3;
            object-fit: cover;
        }

        canvas#snapshot-canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            z-index: 5;
        }

        /* Hiệu ứng lưới Hologram & Tia quét Laser */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 10;
            background: linear-gradient(rgba(255, 71, 87, 0) 50%, rgba(255, 71, 87, 0.08) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        }

        .laser-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ff4757;
            box-shadow: 0 0 15px #ff4757, 0 0 30px #ff4757;
            display: none;
            z-index: 12;
            animation: scanUpDown 1.5s ease-in-out infinite alternate;
        }

        @keyframes scanUpDown {
            0% { top: 0%; }
            100% { top: 98%; }
        }

        /* Thanh tiến trình trên cùng */
        .scan-progress-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 15;
        }
        .scan-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4757, #ffa502);
            transition: width 0.05s linear;
        }

        /* Bảng thông số HUD */
        .hud-panel {
            width: 100%;
            max-width: 500px;
            margin-top: 12px;
            background: rgba(13, 15, 23, 0.85);
            backdrop-filter: blur(16px);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .score-box {
            grid-column: span 2;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.12), rgba(255, 165, 2, 0.12));
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 12px;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(255, 71, 87, 0.08);
        }

        .score-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff4757;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .score-value {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .score-rank {
            font-size: 11px;
            color: #ffa502;
            font-weight: 600;
            margin-top: 2px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-row span:first-child {
            color: #94a3b8;
            font-size: 11px;
        }

        .hud-row span:last-child {
            font-weight: 600;
            color: #f1f5f9;
            font-size: 11px;
        }

        /* Thanh mini progress trong từng chỉ số */
        .mini-progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            transition: width 0.8s ease;
        }

        /* Nút bấm hành động */
        .action-panel {
            margin-top: 12px;
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 8px;
        }

        .btn-scan {
            flex: 1;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-scan:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .btn-scan:disabled {
            background: #272838;
            color: #55576e;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .nut-chuyen-trang {
            display: inline-block;
            margin-top: 15px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .nut-chuyen-trang:hover {
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            top: 20px;
            background: rgba(18, 19, 26, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            font-weight: 600;
            font-size: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="toast">Đang khởi tạo hệ thống...</div>

    <div>
        <div class="header-title">⚡ Hardcore PSL Engine</div>
        <div class="header-subtitle">Hệ thống nhân trắc học khuôn mặt chuẩn xác</div>
    </div>

    <div class="container">
        <div class="scan-progress-container">
            <div id="scan-progress" class="scan-progress-bar"></div>
        </div>

        <!-- Hiệu ứng quét lưới & laser -->
        <div id="scan-overlay" class="scan-overlay"></div>
        <div id="laser-line" class="laser-line"></div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="snapshot-canvas"></canvas>
    </div>

    <div class="hud-panel">
        <div class="score-box">
            <div class="score-title">Hardcore Overall Score</div>
            <div class="score-value" id="hud-score">--</div>
            <div class="score-rank" id="hud-rank">Hãy tạo dáng và bấm chụp...</div>
        </div>

        <div class="hud-item">
            <div class="hud-row"><span>Canthal Tilt</span> <span id="hud-canthal">--</span></div>
            <div class="mini-progress-track"><div id="bar-canthal" class="mini-progress-fill"></div></div>
        </div>

        <div class="hud-item">
            <div class="hud-row"><span>Jawline Ratio</span> <span id="hud-jaw">--</span></div>
            <div class="mini-progress-track"><div id="bar-jaw" class="mini-progress-fill"></div></div>
        </div>

        <div class="hud-item">
            <div class="hud-row"><span>Midface</span> <span id="hud-midface">--</span></div>
            <div class="mini-progress-track"><div id="bar-midface" class="mini-progress-fill"></div></div>
        </div>

        <div class="hud-item">
            <div class="hud-row"><span>Tư thế</span> <span id="hud-dimorph">--</span></div>
            <div class="mini-progress-track"><div id="bar-dimorph" class="mini-progress-fill" style="width: 100%; background: #22c55e;"></div></div>
        </div>
    </div>

    <div class="action-panel">
        <button id="btn-capture" class="btn-scan" onclick="captureAndFreeze()">📸 Chụp & Quét sinh trắc học</button>
        <button id="btn-reset" class="btn-reset" onclick="resetScanner()" style="display: none;">Chụp lại</button>
    </div>

    <p>
        <a href="hoc_html2.html" class="nut-chuyen-trang">
            -> tiếp tục để solo mog cho ae nhé!
        </a>
    </p>

    <script>
        const videoElement = document.getElementById('webcam');
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const snapshotCtx = snapshotCanvas.getContext('2d');
        let latestLandmarks = null;
        let isCaptured = false;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function calculateDistance3D(p1, p2) {
            return Math.sqrt(
                Math.pow(p1.x - p2.x, 2) +
                Math.pow(p1.y - p2.y, 2) +
                Math.pow((p1.z || 0) - (p2.z || 0), 2)
            );
        }

        function getHardcorePSLRank(score) {
            if (score >= 6.5) return "Apex Elite / Chadlite 🏆";
            if (score >= 5.5) return "High Tier Normie 🔥";
            if (score >= 4.5) return "Mid Normie ⚖️";
            if (score >= 3.5) return "Sub-Normie 📉";
            return "Raw Sub5 ⚠️";
        }

        function captureAndFreeze() {
            if (!latestLandmarks) {
                showToast("⚠️ Chưa nhận diện được khuôn mặt! Hãy canh lại camera.");
                return;
            }

            isCaptured = true;

            snapshotCanvas.width = videoElement.videoWidth || 640;
            snapshotCanvas.height = videoElement.videoHeight || 480;
            
            snapshotCtx.drawImage(videoElement, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
            snapshotCanvas.style.display = 'block';

            // Bật hiệu ứng quét laser và lưới hologram
            document.getElementById('scan-overlay').style.display = 'block';
            document.getElementById('laser-line').style.display = 'block';

            document.getElementById('btn-capture').disabled = true;
            document.getElementById('hud-rank').innerText = "Đang phân tích hệ thống cấu trúc mặt...";

            let progress = 0;
            const progressBar = document.getElementById('scan-progress');

            // Kéo dài thời gian quét lên ~2.8 giây (35ms * 80 bước) để tạo cảm giác chuyên nghiệp
            let interval = setInterval(() => {
                progress += 1.25;
                progressBar.style.width = progress + '%';
                document.getElementById('hud-score').innerText = Math.floor(progress) + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    
                    // Tắt hiệu ứng quét
                    document.getElementById('scan-overlay').style.display = 'none';
                    document.getElementById('laser-line').style.display = 'none';

                    processHardcorePSL(latestLandmarks);
                    
                    document.getElementById('btn-capture').style.display = 'none';
                    document.getElementById('btn-capture').disabled = false;
                    document.getElementById('btn-reset').style.display = 'block';
                    showToast("✨ Phân tích nhân trắc học hoàn tất!");
                }
            }, 35);
        }

        function resetScanner() {
            isCaptured = false;
            snapshotCanvas.style.display = 'none';
            document.getElementById('scan-progress').style.width = '0%';
            document.getElementById('hud-score').innerText = '--';
            document.getElementById('hud-rank').innerText = 'Hãy tạo dáng và bấm chụp...';
            document.getElementById('hud-canthal').innerText = '--';
            document.getElementById('hud-jaw').innerText = '--';
            document.getElementById('hud-midface').innerText = '--';
            document.getElementById('hud-dimorph').innerText = '--';

            // Reset các thanh progress nhỏ
            document.getElementById('bar-canthal').style.width = '0%';
            document.getElementById('bar-jaw').style.width = '0%';
            document.getElementById('bar-midface').style.width = '0%';

            document.getElementById('btn-reset').style.display = 'none';
            document.getElementById('btn-capture').style.display = 'block';
            showToast("🔄 Đã khởi động lại camera!");
        }

        function processHardcorePSL(lm) {
            if (!lm) return;

            // 1. Kiểm tra tư thế
            const leftEye = lm[33];
            const rightEye = lm[362];
            const eyeLevelDiff = Math.abs(leftEye.y - rightEye.y);
            let posturePenalty = eyeLevelDiff > 0.03 ? 0.5 : 1.0;

            // 2. Canthal Tilt
            const leftOuterY = lm[133].y;
            const leftInnerY = lm[33].y;
            const leftTiltDiff = leftInnerY - leftOuterY; 
            
            let canthalScore = 0.2; 
            if (leftTiltDiff > 0.010) canthalScore = 1.0; 
            else if (leftTiltDiff > 0.005) canthalScore = 0.6; 
            else if (leftTiltDiff > 0.002) canthalScore = 0.4;
            else canthalScore = 0.2; 

            // 3. Jawline Ratio
            const bizygomaticWidth = calculateDistance3D(lm[234], lm[454]);
            const jawWidth = calculateDistance3D(lm[172], lm[397]);
            const jawToBizygomatic = jawWidth / (bizygomaticWidth > 0 ? bizygomaticWidth : 1);
            
            let jawScore = 0.2;
            if (jawToBizygomatic >= 0.83 && jawToBizygomatic <= 0.88) {
                jawScore = 1.0;
            } else if (jawToBizygomatic >= 0.79 && jawToBizygomatic <= 0.91) {
                jawScore = 0.6;
            } else if (jawToBizygomatic >= 0.75 && jawToBizygomatic <= 0.95) {
                jawScore = 0.4;
            } else {
                jawScore = 0.2; 
            }

            // 4. Midface
            const browCenter = lm[9];
            const mouthCenter = lm[13];
            const faceWidth = bizygomaticWidth;
            const midfaceLength = calculateDistance3D(browCenter, mouthCenter);
            const midfaceRatio = midfaceLength / (faceWidth > 0 ? faceWidth : 1);
            
            let midfaceScore = 0.2;
            if (midfaceRatio < 1.06) midfaceScore = 1.0;
            else if (midfaceRatio < 1.10) midfaceScore = 0.6;
            else if (midfaceRatio < 1.15) midfaceScore = 0.4;
            else midfaceScore = 0.2;

            const compositeScore = (jawScore * 0.45 + canthalScore * 0.35 + midfaceScore * 0.20) * posturePenalty;
            
            let rawScore = 2.8 + compositeScore * 4.0;
            rawScore = Math.min(6.8, Math.max(3.0, rawScore));

            const finalScore = rawScore.toFixed(1);
            const rankName = getHardcorePSLRank(parseFloat(finalScore));

            // Hiển thị kết quả lên giao diện kèm cập nhật thanh progress bar trực quan
            document.getElementById('hud-score').innerText = String(finalScore).replace('.', ',') + " / 10";
            document.getElementById('hud-rank').innerText = rankName;
            
            document.getElementById('hud-canthal').innerText = leftTiltDiff > 0.010 ? "Positive ⚡" : "Flat / Neutral";
            document.getElementById('bar-canthal').style.width = (canthalScore * 100) + '%';

            document.getElementById('hud-jaw').innerText = jawToBizygomatic.toFixed(2) + (jawScore === 1.0 ? " (Ideal)" : " (Avg)");
            document.getElementById('bar-jaw').style.width = (jawScore * 100) + '%';

            document.getElementById('hud-midface').innerText = midfaceRatio < 1.08 ? "Compact 🔥" : "Extended";
            document.getElementById('bar-midface').style.width = (midfaceScore * 100) + '%';

            document.getElementById('hud-dimorph').innerText = posturePenalty < 1.0 ? "⚠️ Lệch góc" : "Chuẩn trực diện ✨";
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            if (!isCaptured && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                latestLandmarks = results.multiFaceLandmarks[0];
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (!isCaptured) {
                    await faceMesh.send({ image: videoElement });
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                showToast("⚡ Hệ thống đã sẵn sàng!");
            })
            .catch((err) => {
                showToast("Lỗi mở Camera!");
                console.error(err);
            });
    </script>
</body>
</html>
