<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSL Face Rating System - Strict Mode</title>
    <!-- Thư viện MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #f4f4f4; }
        p { color: #888; font-size: 14px; margin-bottom: 15px; }

        .display-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            background-color: #121318;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(6px);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(245, 245, 245, 0.466);
            font-size: 13px;
            z-index: 10;
            text-align: left;
            line-height: 1.6;
            pointer-events: none;
        }

        .btn-start {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 15px;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: 0.2s;
        }
        .btn-start:hover { background: #f5f5f5; }

        .nut-chuyen-trang {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .nut-chuyen-trang:hover {
            color: #fdffff;
        }

        .btn-save {
            padding: 8px 10px;
            background: #ffffff; 
            color: #000000;     
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 30%;
            transition: 0.2s;
        }
        .btn-save:hover {
            background: #3e3e3e;
        }
    </style>
</head>
<body>

    <h1>PSL Face Rating System - Strict Mode</h1>
    <p>Chấm điểm cấu trúc xương mặt thuần PSL (Khắt khe & Gắt gao)</p>

    <div class="display-container">
        <video id="webcam" playsinline></video>
        <canvas id="output_canvas"></canvas>
        
        <div id="hud-overlay">
            <div><b>PSL SCORE:</b> <span id="hud-score" style="color: #ff4444;">--</span>/10</div>
            <div><b>RANK:</b> <span id="hud-rank" style="color: #fff;">--</span></div>
            <div><b>SYM:</b> <span id="hud-sym" style="color: #fff;">--%</span> | <b>fWHR:</b> <span id="hud-fwhr" style="color: #fff;">--</span></div>
        </div>
    </div>

    <button class="btn-start" onclick="initAI()">Bắt đầu quét khuôn mặt</button>

    <div style="margin: 20px auto; background: #111; padding: 15px; border-radius: 10px; width: 340px; color: white; font-family: sans-serif; text-align: left;">
        <h3 style="margin-top: 0; text-align: center;">🏆 Bảng Xếp Hạng Cloud</h3>
        
        <div style="margin-bottom: 12px; display: flex;">
            <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15" style="padding: 8px; border-radius: 5px; border: none; width: 70%; margin-right: 5px;">
            <button type="button" onclick="saveGlobalScore()" class="btn-save">Lưu</button>
        </div>

        <ul id="leaderboard-list" style="padding-left: 20px; margin: 0 0 10px 0;">
            <li>Đang tải bảng xếp hạng...</li>
        </ul>
    </div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let cameraInstance = null;
    
    let smoothedScore = 4.5;
    let smoothedSym = 80.0;
    let smoothedFWHR = 1.70;
    
    const alpha = 0.12; 

    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwfw6w4yi6wWQFMaz7CIMGT5yUFV3PufAh9FqpyY2aS_Bc7v1fwUt0Lau8zTcSdcsgt/exec";

    function calculateDistance(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function getPSLRank(score) {
        if (score >= 8.0) return "Apex / Gigachad 👑";
        if (score >= 7.0) return "Chad / Top Model ⭐";
        if (score >= 5.7) return "HTN (High-Tier Normal) ✨";
        if (score >= 4.7) return "MTN (Mid-Tier Normal)";
        if (score >= 3.8) return "LTN (Low-Tier Normal)";
        return "Sub-five";
    }

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const lm = results.multiFaceLandmarks[0];

            canvasCtx.fillStyle = '#ff4444';
            for (let point of lm) {
                const x = point.x * canvasElement.width;
                const y = point.y * canvasElement.height;
                canvasCtx.fillRect(x, y, 1.5, 1.5);
            }

            const chin = lm[152];
            const noseBottom = lm[2];
            const eyebrow = lm[9];
            const leftEye = lm[33], rightEye = lm[263];
            const leftCheek = lm[234], rightCheek = lm[454];
            const leftJaw = lm[58], rightJaw = lm[288];
            const upperLip = lm[13];

            const eyeDistance = calculateDistance(leftEye, rightEye);
            if (eyeDistance === 0) return;

            // 1. Độ cân đối xương (Symmetry) cực kỳ khắt khe
            const eyeDiff = Math.abs(leftEye.y - rightEye.y) / eyeDistance;
            const cheekDiff = Math.abs(leftCheek.y - rightCheek.y) / eyeDistance;
            const symmetryFactor = 1 - ((eyeDiff + cheekDiff) * 2.5); // Phạt nặng hơn nếu lệch
            const currentSym = Math.min(99.9, Math.max(40.0, symmetryFactor * 100));

            // 2. Chỉ số fWHR (Mức độ rộng ngang mặt / chiều cao mặt giữa)
            const midFaceHeight = calculateDistance(eyebrow, upperLip);
            const cheekWidth = calculateDistance(leftCheek, rightCheek);
            let rawFWHR = midFaceHeight > 0 ? (cheekWidth / midFaceHeight) : 1.70;
            const currentFWHR = rawFWHR * 1.35; 

            // 3. Tỷ lệ 1/3 khuôn mặt & độ rộng xương hàm (Gonial Angle / Jaw width)
            const midHeight = calculateDistance(eyebrow, noseBottom) / eyeDistance;
            const lowHeight = calculateDistance(noseBottom, chin) / eyeDistance;
            const thirdRatioDiff = Math.abs(midHeight - lowHeight);
            const jawWidth = calculateDistance(leftJaw, rightJaw);
            const jawRatio = jawWidth / cheekWidth;

            // --- THUẬT TOÁN PSL CHẤM ĐIỂM GẮT GAO (Bắt đầu từ mốc 4.0 trung bình thấp) ---
            let pslScore = 4.2; 

            // Thưởng phạt Symmetry gắt
            if (currentSym >= 90) pslScore += (currentSym - 90) * 0.05;
            else if (currentSym < 80) pslScore -= (80 - currentSym) * 0.08;

            // Thưởng phạt fWHR chuẩn khung xương Nam tính/Hài hòa (Lý tưởng ~1.7 - 1.9)
            if (currentFWHR >= 1.70 && currentFWHR <= 1.95) {
                pslScore += 0.6;
            } else {
                pslScore -= Math.abs(currentFWHR - 1.75) * 0.9; // Lệch chuẩn là trừ điểm sâu
            }

            // Tỷ lệ 3 phần mặt cân đối
            if (thirdRatioDiff < 0.12) pslScore += 0.5;
            else pslScore -= thirdRatioDiff * 1.5;

            // Xương hàm bạnh / sắc nét (Jawline)
            if (jawRatio >= 0.70) pslScore += 0.6;
            else if (jawRatio < 0.58) pslScore -= 0.5; // Hàm hẹp bị trừ điểm

            // Khóa khung điểm nghiêm ngặt từ 2.0 đến 9.0 (Rất khó chạm mốc 8-9 nếu không phải cực phẩm)
            let rawOverall = Math.min(9.0, Math.max(2.0, pslScore));

            smoothedScore += alpha * (rawOverall - smoothedScore);
            smoothedSym += alpha * (currentSym - smoothedSym);
            smoothedFWHR += alpha * (currentFWHR - smoothedFWHR);

            const finalOverall = smoothedScore.toFixed(1);
            const finalSym = smoothedSym.toFixed(1);
            const finalFWHR = smoothedFWHR.toFixed(2);
            
            const rankName = getPSLRank(finalOverall);

            document.getElementById('hud-score').innerText = finalOverall;
            document.getElementById('hud-rank').innerText = rankName;
            document.getElementById('hud-sym').innerText = `${finalSym}%`;
            document.getElementById('hud-fwhr').innerText = finalFWHR;
        }
        canvasCtx.restore();
    }

    async function initAI() {
        canvasElement.width = 640;
        canvasElement.height = 480;

        smoothedScore = 4.5;

        if (cameraInstance !== null) {
            try { await cameraInstance.stop(); } catch(e){}
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        faceMesh.onResults(onResults);

        cameraInstance = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        cameraInstance.start().catch(err => {
            alert("Vui lòng cấp quyền camera để chạy hệ thống!");
            console.error(err);
        });
    }

    function getDeviceToken() {
        let token = localStorage.getItem('psl_device_token');
        if (!token) {
            token = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('psl_device_token', token);
        }
        return token;
    }

    window.onload = loadLeaderboard;

    function loadLeaderboard() {
        fetch(GOOGLE_API_URL)
            .then(response => response.json())
            .then(data => {
                let html = "";
                if (!data || data.length === 0) {
                    html = "<li>Chưa có ai lên bảng vàng.</li>";
                } else {
                    data.sort((a, b) => b.score - a.score);
                    data.slice(0, 10).forEach((item, index) => {
                        html += `<li style="margin-bottom: 5px;"><b>#${index + 1}</b> ${item.name}: <span style="color: #ff4444;">${item.score}</span> (${item.rank})</li>`;
                    });
                }
                document.getElementById('leaderboard-list').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('leaderboard-list').innerHTML = "<li>Lỗi tải bảng xếp hạng.</li>";
            });
    }

    function saveGlobalScore() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("Vui lòng nhập tên của bạn!");
            return;
        }

        const currentScore = parseFloat(document.getElementById('hud-score').innerText);
        const currentRank = document.getElementById('hud-rank').innerText;
        
        if (isNaN(currentScore)) {
            alert("Vui lòng bật AI quét mặt trước khi lưu điểm!");
            return;
        }

        const payload = {
            token: getDeviceToken(),
            name: nameInput,
            score: currentScore,
            rank: currentRank
        };

        alert("Đang gửi điểm lên Cloud...");

        fetch(GOOGLE_API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            alert(`Thành công! Đã cập nhật tên "${nameInput}" lên hệ thống. 🎉`);
            document.getElementById('player-name').value = "";
            loadLeaderboard();
        })
        .catch(err => {
            alert("Có lỗi khi lưu điểm lên Cloud!");
        });
    }
</script>
