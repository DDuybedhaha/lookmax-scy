<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore PSL Analyzer | Clean Edition</title>
    <!-- Nhúng thư viện MediaPipe Face Mesh từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1c29 0%, #0a0b10 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ff4757;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
            text-align: center;
        }

        .header-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #12131a;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Lật gương cho tự nhiên */
            aspect-ratio: 4/3;
            object-fit: cover;
        }

        canvas {
            display: none; /* Ẩn hoàn toàn chấm trên mặt */
        }

        /* Thanh tiến trình quét */
        .scan-progress-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .scan-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4757, #ffa502);
            transition: width 0.1s linear;
        }

        /* HUD gọn gàng ở đáy camera */
        .hud-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 15, 23, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .hud-main-score {
            font-size: 20px;
            font-weight: 900;
            color: #38bdf8;
        }

        .hud-sub-info {
            font-size: 13px;
            color: #ffa502;
            font-weight: 600;
        }

        /* Toast thông báo */
        #toast {
            position: fixed;
            top: 20px;
            background: rgba(18, 19, 26, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="toast">Đang khởi tạo hệ thống...</div>

    <div>
        <div class="header-title">⚡ Hardcore PSL Engine</div>
        <div class="header-subtitle">Hệ thống nhân trắc học khuôn mặt khắt khe</div>
    </div>

    <div class="container">
        <div class="scan-progress-container">
            <div id="scan-progress" class="scan-progress-bar"></div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        
        <div class="hud-overlay">
            <div>
                <span style="color: #94a3b8; font-size: 11px;">SCORE:</span>
                <span class="hud-main-score" id="hud-score">--</span>
            </div>
            <div class="hud-sub-info" id="hud-rank">Đang quét ổn định...</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function calculateDistance3D(p1, p2) {
            return Math.sqrt(
                Math.pow(p1.x - p2.x, 2) +
                Math.pow(p1.y - p2.y, 2) +
                Math.pow((p1.z || 0) - (p2.z || 0), 2)
            );
        }

        function getHardcorePSLRank(score) {
            if (score >= 6.5) return "Apex Elite 🏆";
            if (score >= 5.5) return "High Normie 🔥";
            if (score >= 4.5) return "Mid Normie ⚖️";
            if (score >= 3.5) return "Sub-Normie 📉";
            return "Raw Sub5 ⚠️";
        }

        let scoreBuffer = [];
        const BUFFER_LIMIT = 90; // Khoảng 3 giây quét

        function processHardcorePSL(lm) {
            if (!lm) return;

            const leftEye = lm[33];
            const rightEye = lm[362];
            const eyeLevelDiff = Math.abs(leftEye.y - rightEye.y);
            let posturePenalty = eyeLevelDiff > 0.03 ? 0.5 : 1.0;

            const leftOuterY = lm[133].y;
            const leftInnerY = lm[33].y;
            const leftTiltDiff = leftInnerY - leftOuterY; 
            let canthalScore = (leftTiltDiff > 0.010) ? 1.0 : (leftTiltDiff > 0.005 ? 0.5 : 0.2); 

            const bizygomaticWidth = calculateDistance3D(lm[234], lm[454]);
            const jawWidth = calculateDistance3D(lm[172], lm[397]);
            const jawToBizygomatic = jawWidth / (bizygomaticWidth > 0 ? bizygomaticWidth : 1);
            let jawScore = (jawToBizygomatic >= 0.83 && jawToBizygomatic <= 0.88) ? 1.0 : (jawToBizygomatic >= 0.78 && jawToBizygomatic <= 0.92 ? 0.5 : 0.1);

            const browCenter = lm[9];
            const mouthCenter = lm[13];
            const midfaceLength = calculateDistance3D(browCenter, mouthCenter);
            const midfaceRatio = midfaceLength / (bizygomaticWidth > 0 ? bizygomaticWidth : 1);
            let midfaceScore = (midfaceRatio < 1.08) ? 1.0 : (midfaceRatio < 1.15 ? 0.5 : 0.1);

            const compositeScore = (jawScore * 0.45 + canthalScore * 0.35 + midfaceScore * 0.20) * posturePenalty;
            
            let rawScore = 2.8 + compositeScore * 4.0;
            rawScore = Math.min(6.8, Math.max(3.0, rawScore));

            scoreBuffer.push(rawScore);
            if (scoreBuffer.length > BUFFER_LIMIT) {
                scoreBuffer.shift();
            }

            const progressPercent = Math.round((scoreBuffer.length / BUFFER_LIMIT) * 100);
            document.getElementById('scan-progress').style.width = progressPercent + '%';

            if (scoreBuffer.length < BUFFER_LIMIT) {
                document.getElementById('hud-score').innerText = `${progressPercent}%`;
                document.getElementById('hud-rank').innerText = "Đang giữ nguyên tư thế...";
                return;
            }

            const avgScore = scoreBuffer.reduce((a, b) => a + b, 0) / scoreBuffer.length;
            const finalScore = parseFloat(avgScore.toFixed(1));
            const rankName = getHardcorePSLRank(finalScore);

            document.getElementById('hud-score').innerText = finalScore.toFixed(1) + " / 10";
            document.getElementById('hud-rank').innerText = rankName;
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                processHardcorePSL(landmarks);
            } else {
                scoreBuffer = [];
                document.getElementById('scan-progress').style.width = '0%';
                document.getElementById('hud-score').innerText = "--";
                document.getElementById('hud-rank').innerText = "Đưa mặt vào khung...";
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                showToast("⚡ Camera đã sẵn sàng");
            })
            .catch((err) => {
                showToast("Lỗi mở Camera!");
                console.error(err);
            });
    </script>
</body>
</html>
