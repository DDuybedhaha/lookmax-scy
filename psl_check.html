<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSL Face Rating System - Strict Mode</title>
    <!-- Thư viện MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #f4f4f4; }
        p { color: #888; font-size: 14px; margin-bottom: 15px; }

        .display-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            background-color: #121318;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(6px);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(245, 245, 245, 0.466);
            font-size: 13px;
            z-index: 10;
            text-align: left;
            line-height: 1.6;
            pointer-events: none;
        }

        .btn-start {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 15px;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: 0.2s;
        }
        .btn-start:hover { background: #f5f5f5; }

        .nut-chuyen-trang {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .nut-chuyen-trang:hover {
            color: #fdffff;
        }

        .btn-save {
            padding: 8px 10px;
            background: #ffffff; 
            color: #000000;     
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 30%;
            transition: 0.2s;
        }
        .btn-save:hover {
            background: #3e3e3e;
            color: #ffffff;
        }

        .btn-danger {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-danger:hover {
            background: #cc0000;
        }

        .leaderboard-scroll {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding-left: 20px;
            margin: 0;
            scrollbar-width: thin;
            scrollbar-color: #555 #111;
        }
        .leaderboard-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .leaderboard-scroll::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h1>PSL Face Rating System - Strict Mode</h1>
    <p>Chấm điểm cấu trúc xương mặt thuần PSL (Chuẩn mực nghiêm khắc)</p>

    <div class="display-container">
        <video id="webcam" playsinline></video>
        <canvas id="output_canvas"></canvas>
        
        <div id="hud-overlay">
            <div><b>PSL SCORE:</b> <span id="hud-score" style="color: #ff4444;">--</span>/10</div>
            <div><b>RANK:</b> <span id="hud-rank" style="color: #fff;">--</span></div>
            <div><b>SYM:</b> <span id="hud-sym" style="color: #fff;">--%</span> | <b>fWHR:</b> <span id="hud-fwhr" style="color: #fff;">--</span></div>
        </div>
    </div>

    <button class="btn-start" onclick="initAI()">Bắt đầu quét khuôn mặt</button>

    <div style="margin: 20px auto; background: #111; padding: 15px; border-radius: 10px; width: 360px; color: white; font-family: sans-serif; text-align: left;">
        <h3 style="margin-top: 0; text-align: center;">🏆 Bảng Xếp Hạng Cloud</h3>
        
        <div style="margin-bottom: 12px; display: flex;">
            <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15" style="padding: 8px; border-radius: 5px; border: none; width: 70%; margin-right: 5px;">
            <button type="button" onclick="saveGlobalScore()" class="btn-save">Lưu</button>
        </div>

        <div style="font-size: 13px; font-weight: bold; color: #ffaa00; margin-bottom: 5px;">⭐ Top 3 Cao Thủ:</div>
        <ul id="top3-list" style="padding-left: 20px; margin: 0 0 10px 0; font-size: 14px;">
            <li>Đang tải...</li>
        </ul>

        <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">

        <div style="font-size: 13px; font-weight: bold; color: #888; margin-bottom: 5px;">📜 Các vị trí khác (Cuộn xuống xem):</div>
        <ul id="rest-list" class="leaderboard-scroll" style="font-size: 13px;">
            <li>Đang tải...</li>
        </ul>

        <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">

        <div id="user-status-box" style="font-size: 13px; background: #1a1b22; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 10px;">
            Trạng thái của bạn: <b>Chưa xác định</b>
        </div>

        <div style="text-align: center;">
            <button type="button" onclick="clearLeaderboardData()" class="btn-danger">🗑️ Xóa toàn bộ BXH</button>
        </div>
    </div>

<script>
    function getAPIUrl() { 
        return "https://script.google.com/macros/s/AKfycbzlV1eDsYin1aTSF3cDwXmVVTLMqtoPtX5AT5hLRueL9dsttedaF75Eo6k_HkwewZnA/exec"; 
    }
    const _cfg = { p: "MTIzNDU2a2I=" };
    function getSecretPwd() { return atob(_cfg.p); }

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let cameraInstance = null;
    let smoothedScore = 5.0;
    let smoothedSym = 85.0;
    let smoothedFWHR = 1.75;
    const alpha = 0.12; 

    function calculateDistance(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function getPSLRank(score) {
        if (score >= 8.0) return "Apex / Gigachad 👑";
        if (score >= 7.0) return "Chad / Top Model ⭐";
        if (score >= 6.6) return "Chadlite ✨";
        if (score >= 5.7) return "HTN (High-Tier Normal)";
        if (score >= 4.7) return "MTN (Mid-Tier Normal)";
        if (score >= 3.8) return "LTN (Low-Tier Normal)";
        return "Sub-five";
    }

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const lm = results.multiFaceLandmarks[0];

            canvasCtx.fillStyle = '#ff4444';
            for (let point of lm) {
                const x = point.x * canvasElement.width;
                const y = point.y * canvasElement.height;
                canvasCtx.fillRect(x, y, 1.5, 1.5);
            }

            const chin = lm[152];
            const noseBottom = lm[2];
            const eyebrow = lm[9];
            const leftEye = lm[33], rightEye = lm[263];
            const leftCheek = lm[234], rightCheek = lm[454];
            const leftJaw = lm[58], rightJaw = lm[288];
            const upperLip = lm[13];

            const eyeDistance = calculateDistance(leftEye, rightEye);
            if (eyeDistance === 0) return;

            const eyeDiff = Math.abs(leftEye.y - rightEye.y) / eyeDistance;
            const cheekDiff = Math.abs(leftCheek.y - rightCheek.y) / eyeDistance;
            const symmetryFactor = 1 - ((eyeDiff + cheekDiff) * 3.0);
            const currentSym = Math.min(99.9, Math.max(30.0, symmetryFactor * 100));

            const midFaceHeight = calculateDistance(eyebrow, upperLip);
            const cheekWidth = calculateDistance(leftCheek, rightCheek);
            let rawFWHR = midFaceHeight > 0 ? (cheekWidth / midFaceHeight) : 1.70;
            const currentFWHR = rawFWHR * 1.35; 

            const midHeight = calculateDistance(eyebrow, noseBottom) / eyeDistance;
            const lowHeight = calculateDistance(noseBottom, chin) / eyeDistance;
            const thirdRatioDiff = Math.abs(midHeight - lowHeight);
            const jawWidth = calculateDistance(leftJaw, rightJaw);
            const jawRatio = jawWidth / cheekWidth;

            let pslScore = 4.2; 
            
            if (currentSym >= 90) pslScore += (currentSym - 90) * 0.04;
            else if (currentSym < 80) pslScore -= (80 - currentSym) * 0.08;

            if (currentFWHR >= 1.70 && currentFWHR <= 1.95) {
                pslScore += 0.5; 
            } else {
                pslScore -= Math.abs(currentFWHR - 1.75) * 0.9;
            }

            if (thirdRatioDiff < 0.12) pslScore += 0.4; 
            else pslScore -= thirdRatioDiff * 1.5;

            if (jawRatio >= 0.68) pslScore += 0.5; 
            else if (jawRatio < 0.58) pslScore -= 0.5;

            let rawOverall = Math.min(9.5, Math.max(1.5, pslScore));

            smoothedScore += alpha * (rawOverall - smoothedScore);
            smoothedSym += alpha * (currentSym - smoothedSym);
            smoothedFWHR += alpha * (currentFWHR - smoothedFWHR);

            const finalOverall = smoothedScore.toFixed(1);
            const finalSym = smoothedSym.toFixed(1);
            const finalFWHR = smoothedFWHR.toFixed(2);
            
            const rankName = getPSLRank(finalOverall);

            document.getElementById('hud-score').innerText = finalOverall;
            document.getElementById('hud-rank').innerText = rankName;
            document.getElementById('hud-sym').innerText = `${finalSym}%`;
            document.getElementById('hud-fwhr').innerText = finalFWHR;
        }
        canvasCtx.restore();
    }

    async function initAI() {
        canvasElement.width = 640;
        canvasElement.height = 480;
        smoothedScore = 5.0;

        if (cameraInstance !== null) {
            try { await cameraInstance.stop(); } catch(e){}
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        faceMesh.onResults(onResults);

        cameraInstance = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        cameraInstance.start().catch(err => {
            alert("Vui lòng cấp quyền camera để chạy hệ thống!");
            console.error(err);
        });
    }

    function getDeviceToken() {
        let token = localStorage.getItem('psl_device_token');
        if (!token) {
            token = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('psl_device_token', token);
        }
        return token;
    }

    window.onload = loadLeaderboard;

    function loadLeaderboard() {
        fetch(getAPIUrl())
            .then(response => response.json())
            .then(data => {
                let top3Html = "";
                let restHtml = "";
                
                if (!data || data.length === 0) {
                    top3Html = "<li>Chưa có ai lên bảng vàng.</li>";
                    restHtml = "<li>Trống.</li>";
                } else {
                    data.sort((a, b) => b.score - a.score);
                    
                    const top3 = data.slice(0, 3);
                    top3.forEach((item, index) => {
                        let crown = index === 0 ? "👑 " : (index === 1 ? "🥈 " : "🥉 ");
                        top3Html += `<li style="margin-bottom: 4px;"><b>${crown}#${index + 1}</b> ${item.name}: <span style="color: #ff4444;">${item.score}</span> <br><small style="color:#aaa;">(${item.rank})</small></li>`;
                    });

                    const theRest = data.slice(3);
                    if (theRest.length === 0) {
                        restHtml = "<li style='color: #666;'>Chưa có thêm thành viên nào khác.</li>";
                    } else {
                        theRest.forEach((item, index) => {
                            restHtml += `<li style="margin-bottom: 4px;"><b>#${index + 4}</b> ${item.name}: <span style="color: #ff4444;">${item.score}</span> (${item.rank})</li>`;
                        });
                    }

                    const myToken = getDeviceToken();
                    const myRecordIndex = data.findIndex(x => x.token === myToken);
                    const userBox = document.getElementById('user-status-box');
                    
                    if (myRecordIndex !== -1) {
                        const myRecord = data[myRecordIndex];
                        userBox.innerHTML = `Vị trí của bạn: <b>#${myRecordIndex + 1}</b> (${myRecord.name}) <br>Điểm: <span style="color:#ff4444;">${myRecord.score}</span> - Rank: <b>${myRecord.rank}</b>`;
                    } else {
                        userBox.innerHTML = `Trạng thái: <b>Chưa lưu điểm trên máy này</b>`;
                    }
                }
                
                document.getElementById('top3-list').innerHTML = top3Html;
                document.getElementById('rest-list').innerHTML = restHtml;
            })
            .catch(err => {
                document.getElementById('top3-list').innerHTML = "<li>Lỗi tải dữ liệu.</li>";
                document.getElementById('rest-list').innerHTML = "<li>Lỗi tải dữ liệu.</li>";
            });
    }

    function saveGlobalScore() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("Vui lòng nhập tên của bạn!");
            return;
        }

        const currentScore = parseFloat(document.getElementById('hud-score').innerText);
        const currentRank = document.getElementById('hud-rank').innerText;
        
        if (isNaN(currentScore)) {
            alert("Vui lòng bật AI quét mặt trước khi lưu điểm!");
            return;
        }

        const payload = {
            token: getDeviceToken(),
            name: nameInput,
            score: currentScore,
            rank: currentRank
        };

        alert("Đang gửi điểm lên Cloud...");

        fetch(getAPIUrl(), {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            alert(`Thành công! Đã cập nhật tên "${nameInput}" lên hệ thống. 🎉`);
            document.getElementById('player-name').value = "";
            loadLeaderboard();
        })
        .catch(err => {
            alert("Có lỗi khi lưu điểm lên Cloud!");
        });
    }

    function clearLeaderboardData() {
        const password = prompt("Nhập mật khẩu quản trị để xóa bảng xếp hạng:");
        if (password === null) return; 
        
        if (password !== getSecretPwd()) {
            alert("Sai mật khẩu! Không thể xóa.");
            return;
        }

        if (!confirm("Bạn có chắc chắn muốn xóa sạch toàn bộ điểm số trên bảng xếp hạng không?")) {
            return;
        }

        alert("Đang yêu cầu xóa dữ liệu trên hệ thống...");

        const payload = {
            action: "clear",
            password: password
        };

        fetch(getAPIUrl(), {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            alert("Đã xóa sạch bảng xếp hạng thành công! 🧹");
            loadLeaderboard();
        })
        .catch(err => {
            alert("Có lỗi xảy ra khi xóa dữ liệu!");
        });
    }
</script>

</body>
</html>
